# The cb2026 workspace. See docs/PRD.md "Architecture" for what each crate is for.
#
# Chess logic lives in `chess` and `engine`, which do no I/O. `protocol`, `shell` and `cli` are
# thin adapters on top, so UCI, XBoard and the interactive shell all drive the same engine.

[workspace]
resolver = "3"
members = ["crates/*"]
# Everything but the NNUE trainer, which `cargo build` and `cargo run` skip unless asked for
# (`-p cb2026-trainer`): its GPU backend will bring a large dependency the engine doesn't need.
# `cargo test --workspace` and `scripts/check.sh` still cover it.
default-members = [
    "crates/chess",
    "crates/cli",
    "crates/cnp",
    "crates/engine",
    "crates/nnue",
    "crates/protocol",
    "crates/shell",
    "crates/syzygy",
    "crates/tools",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cjus/chessengine"
publish = false

[workspace.dependencies]
cb2026-chess = { path = "crates/chess" }
cb2026-cnp = { path = "crates/cnp" }
cb2026-engine = { path = "crates/engine" }
cb2026-nnue = { path = "crates/nnue" }
cb2026-protocol = { path = "crates/protocol" }
cb2026-shell = { path = "crates/shell" }
cb2026-syzygy = { path = "crates/syzygy" }
cb2026-tools = { path = "crates/tools" }
cb2026-trainer = { path = "crates/trainer" }
# The Chess Node Protocol, how Solrac talks to cb2026 (`crates/cnp`), and its conformance
# sessions (Solrac Chess AI #98). Pinned to a commit; bump both together.
cnp = { git = "https://github.com/cjus/chess-node-protocol", rev = "68cf80d917066de0e366952b334eb82a65fa42d6" }
cnp-conformance = { git = "https://github.com/cjus/chess-node-protocol", rev = "68cf80d917066de0e366952b334eb82a65fa42d6" }

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
# Every public item is documented: this is a learning project.
missing_docs = "deny"
# Inside an `unsafe fn`, each unsafe operation still needs its own `unsafe` block.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Every `unsafe` block needs a `// SAFETY:` comment explaining why it is sound.
undocumented_unsafe_blocks = "deny"

[profile.release]
# An engine spends almost all its time in a few hot loops, so we trade build time for speed:
# whole-program optimisation across crates and a single codegen unit.
lto = "fat"
codegen-units = 1
# A panic is a bug; abort instead of unwinding (smaller, slightly faster code).
panic = "abort"
