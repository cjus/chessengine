# Builds and tests on macOS (Apple Silicon) and Windows. Kept off pull requests because those
# runners cost more Actions minutes on private repos; runs weekly, on stage and release tags,
# and on demand.
name: Cross-platform

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    tags: ["stage-*", "v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked
