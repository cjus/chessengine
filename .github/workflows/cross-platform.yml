# Builds and tests on macOS (Apple Silicon) and Windows. Kept off pull requests because those
# runners cost more Actions minutes on private repos; runs weekly, on stage and release tags,
# and on demand.
name: Cross-platform

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    tags: ["stage-*", "v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Chess Node Protocol's crates (`cnp`, `cnp-conformance`) live in a private repository:
      # fetch them over SSH with a read-only deploy key (cjus/chessengine#143). The key's comment is
      # the repository's address, which the agent uses to pick it for that repository.
      - name: Check the protocol's deploy key is set
        env:
          KEY: ${{ secrets.CNP_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The CNP_DEPLOY_KEY secret is missing, so CI can't fetch the cnp crate from cjus/chess-node-protocol (private). See cjus/chessengine#143."
            exit 1
          fi
        shell: bash
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CNP_DEPLOY_KEY }}
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Only main saves a cache (the weekly run), not release tags: the caches stay under
      # GitHub's 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked
