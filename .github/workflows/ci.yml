# Checks every pull request, drafts included, and main every night. Run it on any branch by hand
# with `gh workflow run ci.yml --ref <branch>`. Linux only; macOS and Windows run in
# cross-platform.yml.
#
# The one job, `CI`, is the check `main`'s ruleset (`main: PR + CI`) requires before a PR merges.
# A pull request's run checks the PR merged into main, so there is no run after a merge; the
# nightly run checks main as it is and finds new security advisories, which can appear without a
# change. From 2026-10-22 to 2026-11-01 GitHub checked no PRs and `scripts/check.sh` was the only
# check: the private repository's Actions minutes had run out (Solrac Chess AI #73). It has been
# public since 2026-10-30, where Actions is free, so PRs are checked again (#233).
#
# Only main saves the build cache (the nightly run, or a run started by hand on main). Pull
# requests reuse it, which keeps the caches under GitHub's 10 GB limit.
#
# The steps are the same as `scripts/check.sh`'s: change both together.
name: CI

on:
  pull_request:
  schedule:
    # 05:17 UTC, off the hour, when Actions is least busy.
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The trainer's GPU backend sits behind its `gpu` feature. There is no GPU here, so its
      # tests say so and pass; they run on the GPU in scripts/check.sh on the Mac.
      - name: Clippy (the trainer's GPU backend)
        run: cargo clippy -p cb2026-trainer --features gpu --all-targets --locked -- -D warnings
      - name: Cache the test tablebases
        uses: actions/cache@v4
        with:
          path: syzygy-tables
          key: syzygy-test-${{ hashFiles('scripts/download-syzygy.sh') }}
      # The tablebase tests run when this succeeds; if the download site is down they are
      # skipped (with a warning) rather than blocking every PR.
      - name: Download the test tablebases
        continue-on-error: true
        run: |
          scripts/download-syzygy.sh syzygy-tables test
          echo "CB2026_SYZYGY_PATH=$PWD/syzygy-tables" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --workspace --locked
      - name: Tests (the trainer's GPU backend)
        # A block, since a plain YAML value can't end in a colon.
        run: |
          cargo test -p cb2026-trainer --features gpu --locked gpu::
      - name: Perft suites (release build, every depth)
        run: cargo run --release --locked -p cb2026-tools --bin perft-suite
      - name: Docs
        run: |
          cargo doc --workspace --no-deps --document-private-items --locked
          cargo doc -p cb2026-trainer --features gpu --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licences, advisories, bans and sources
        run: cargo deny check
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the book
        run: mdbook build book
