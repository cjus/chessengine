# Runs on every pull request and on main. Linux only, to keep private-repo Actions minutes low;
# macOS and Windows run in cross-platform.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Cache the test tablebases
        uses: actions/cache@v4
        with:
          path: syzygy-tables
          key: syzygy-test-${{ hashFiles('scripts/download-syzygy.sh') }}
      # The tablebase tests run when this succeeds; if the download site is down they are
      # skipped (with a warning) rather than blocking every PR.
      - name: Download the test tablebases
        continue-on-error: true
        run: |
          scripts/download-syzygy.sh syzygy-tables test
          echo "CB2026_SYZYGY_PATH=$PWD/syzygy-tables" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --workspace --locked
      - name: Perft suites (release build, every depth)
        run: cargo run --release --locked -p cb2026-tools --bin perft-suite
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licences, advisories, bans and sources
        run: cargo deny check

  book:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the book
        run: mdbook build book
