# Builds release binaries when a version tag (v1.0.0, ...) is pushed and attaches them, with the
# default NNUE network, to a draft GitHub release, which Carlos reviews and publishes. See
# docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The third-party notices (scripts/notices.sh), made once on Linux and put in every package:
  # they cover every platform's crates.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: scripts/notices.sh
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: target/licences/THIRD-PARTY-NOTICES.txt

  build:
    name: build (${{ matrix.target }})
    needs: notices
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p cb2026 --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - name: Package
        shell: bash
        run: |
          name="cb2026-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE crates/syzygy/LICENSE-GPL-3.0 \
            THIRD-PARTY-NOTICES.txt "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/cb2026.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/cb2026" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The default NNUE network goes on the release as a file of its own as well, for anyone
      # who wants it (the binaries have it built in). See nets/README.md.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nets
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: The default network
        run: cp nets/*.nnue assets/
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: assets/*
