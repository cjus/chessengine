# Builds release binaries when a version tag (v1.0.0, ...) is pushed and attaches them to a
# draft GitHub release, which Carlos reviews and publishes. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p cb2026 --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="cb2026-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE crates/syzygy/LICENSE-GPL-3.0 "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/cb2026.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/cb2026" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: assets/*
