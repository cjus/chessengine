# Fuzz tests for the parsers (docs/PRD.md, "Testing and strength measurement"): every week if
# main changed, and on demand, each target runs for a few minutes. Not a required check: a crash found here
# becomes an issue and a regular test. Weekly rather than nightly since Actions minutes ran out
# in October 2026 (cjus/chessgui#73): the three targets cost about 21 minutes a run.
name: Fuzz

on:
  schedule:
    # Mondays 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # The weekly run asks which commit the last good run fuzzed.
  actions: read

jobs:
  # The weekly run goes on only if main changed since the last good run; otherwise it costs this
  # one short Linux job. Tags and runs started by hand always go on.
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fuzz.yml --branch main \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
            if [ "$last" = "$GITHUB_SHA" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run: $run."

  fuzz:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fen, moves, uci]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} for 5 minutes
        working-directory: fuzz
        # `+nightly`: the repository pins stable Rust (rust-toolchain.toml); fuzzing needs nightly.
        # `--target`: cargo-fuzz defaults to the platform it was itself built for, and the
        # prebuilt cargo-fuzz installed above is a static musl build. Fuzzing for musl fails
        # (no std for it on nightly, and AddressSanitizer can't use a statically linked libc),
        # so name the runner's own target.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300 -timeout=10
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts
