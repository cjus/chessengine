# Fuzz tests for the parsers (docs/PRD.md, "Testing and strength measurement"): every night and
# on demand, each target runs for a few minutes. Not a required check: a crash found here
# becomes an issue and a regular test.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fen, moves, uci]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} for 5 minutes
        working-directory: fuzz
        # `+nightly`: the repository pins stable Rust (rust-toolchain.toml); fuzzing needs nightly.
        # `--target`: cargo-fuzz defaults to the platform it was itself built for, and the
        # prebuilt cargo-fuzz installed above is a static musl build. Fuzzing for musl fails
        # (no std for it on nightly, and AddressSanitizer can't use a statically linked libc),
        # so name the runner's own target.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300 -timeout=10
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts
