<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" role="img" aria-labelledby="ab-t ab-d">
<title id="ab-t">Once one reply refutes a move, alpha-beta skips that move's other replies</title>
<desc id="ab-d">A two-ply game tree. White, at the root, has moves a and b. Black's replies to a lead to leaves scored +1 and +3, so a is worth +1 to White. Black's first reply to b, b1, scores -2, which is already worse for White than +1, so b is worth at most -2 and its other replies, b2 and b3, drawn dashed, are never searched. The root is worth +1.</desc>
<style>
  .hd { font: 700 13px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .08em; fill: #1F2937; }
  .lbl { font: 400 14px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1F2937; }
  .sm { font: 400 13px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #4B5563; }
  .cd { font: 400 14px "SF Mono", Menlo, Consolas, monospace; fill: #1F2937; }
  .cds { font: 400 13px "SF Mono", Menlo, Consolas, monospace; fill: #1F2937; }
  .note { font: italic 400 13px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #4B5563; }
  .bad { font: italic 400 13px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #B4261E; }
  .pc { font: 700 14px "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .coord { font: 400 13px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #6B7280; }
</style>
<defs><marker id="ab-ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6B7280"/></marker><marker id="ab-ari" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F2937"/></marker></defs>
<rect width="640" height="432" fill="#FFFFFF"/>
<text class="hd" x="24" y="76">WHITE</text><text class="sm" x="24" y="94">picks the max</text><text class="hd" x="24" y="186">BLACK</text><text class="sm" x="24" y="204">picks the min</text><text class="hd" x="24" y="296">LEAVES</text><text class="sm" x="24" y="314">evaluated</text><path d="M330,106 L210,158" stroke="#1F2937" stroke-width="1.8"/><text class="cds" x="256.0" y="128.0" text-anchor="middle">a</text><path d="M330,106 L450,158" stroke="#1F2937" stroke-width="1.8"/><text class="cds" x="404.0" y="128.0" text-anchor="middle">b</text><path d="M195,200 L145,268" stroke="#1F2937" stroke-width="1.8"/><text class="cds" x="154.0" y="234.0" text-anchor="middle">a1</text><path d="M225,200 L275,268" stroke="#1F2937" stroke-width="1.8"/><text class="cds" x="266.0" y="234.0" text-anchor="middle">a2</text><path d="M450,202 L380,268" stroke="#1F2937" stroke-width="1.8"/><text class="cds" x="399.0" y="235.0" text-anchor="middle">b1</text><path d="M450,202 L470,268" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="5 4"/><text class="cds" x="474.0" y="235.0" text-anchor="middle">b2</text><path d="M450,202 L560,268" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="5 4"/><text class="cds" x="523.0" y="235.0" text-anchor="middle">b3</text><circle cx="330" cy="84" r="22" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text class="lbl" x="330" y="89" text-anchor="middle">+1</text><rect x="188" y="158" width="44" height="44" rx="4" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text class="lbl" x="210" y="185" text-anchor="middle">+1</text><rect x="428" y="158" width="44" height="44" rx="4" fill="#F7D9A5" stroke="#C08A1E" stroke-width="2"/><text class="lbl" x="450" y="185" text-anchor="middle">≤ −2</text><circle cx="145" cy="290" r="22" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text class="lbl" x="145" y="295" text-anchor="middle">+1</text><circle cx="275" cy="290" r="22" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text class="lbl" x="275" y="295" text-anchor="middle">+3</text><circle cx="380" cy="290" r="22" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text class="lbl" x="380" y="295" text-anchor="middle">−2</text><circle cx="470" cy="290" r="22" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 4"/><text class="sm" x="470" y="295" text-anchor="middle">?</text><circle cx="560" cy="290" r="22" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 4"/><text class="sm" x="560" y="295" text-anchor="middle">?</text><text class="sm" x="210" y="230" text-anchor="middle"></text><text class="lbl" x="496" y="176">cutoff</text><text class="sm" x="496" y="194">after one reply</text><text class="note" x="515" y="336" text-anchor="middle">never searched</text><text class="lbl" x="360" y="34" text-anchor="middle">After move a, White can already guarantee +1 (alpha = +1).</text><text class="lbl" x="320" y="372" text-anchor="middle">Black's first reply to b scores −2, worse for White than a's +1,</text><text class="lbl" x="320" y="392" text-anchor="middle">so White will never play b, and its other replies can't change that.</text><text class="note" x="320" y="418" text-anchor="middle">At Black's node that is a beta cutoff: in negamax, Black's +2 is at least its beta of −1.</text>
</svg>
