<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" width="640" height="412" role="img" aria-labelledby="cm-t cm-d">
<title id="cm-t">In check, a piece may only land on the check mask; a pinned piece may only move along its pin</title>
<desc id="cm-d">Two chess boards. Left: a black rook on e7 checks the white king on e1; squares e2 to e7 are shaded as the check mask, and the white knight on c3 has only two legal moves, e2 and e4, both inside it. Right: a white bishop on d2 is pinned to its king on e1 by a black bishop on a5; the squares c3, b4 and a5 are shaded, and they are the bishop's only legal moves.</desc>
