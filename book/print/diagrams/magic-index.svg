<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" width="640" height="392" role="img" aria-labelledby="mg-t mg-d">
<title id="mg-t">A rook on d4 depends on only 10 squares, so its attacks are one of 1,024 table entries</title>
<desc id="mg-d">Left: a board with a rook on d4. Ten squares on its rank and file are shaded as relevant (d2, d3, d5, d6, d7, b4, c4, e4, f4, g4); the four ray ends d1, d8, a4 and h4 are outlined with dashes because the rook attacks them whether or not they are occupied. Right: four steps from top to bottom: mask the occupancy, multiply by the magic number, shift right by 64 minus 10 to get an index from 0 to 1023, and look the attacks up in the table.</desc>
