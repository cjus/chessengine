# cargo-deny configuration: run `cargo deny check` (CI runs it on every PR).
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Known security vulnerabilities and unmaintained crates fail the check.
ignore = []

[licenses]
# cb2026 is GPL-3.0-or-later, so every dependency must have a GPL-3.0-compatible licence.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is for future dependencies; don't warn about licences nothing uses yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, without a version; that's fine for
# crates that are never published.
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
