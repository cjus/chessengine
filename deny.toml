# cargo-deny configuration: run `cargo deny check` (CI runs it on every PR).
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Known security vulnerabilities and unmaintained crates fail the check.
ignore = []

[licenses]
# cb2026 is `MIT OR Apache-2.0`, so every dependency must have a permissive licence (or
# MPL-2.0, which covers only its own files). GPL is allowed only for the Syzygy prober below.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is for future dependencies; don't warn about licences nothing uses yet.
unused-allowed-license = "allow"

# The one GPL exception: Syzygy probing (`docs/PRD.md`, "Tablebase probing"), linked only by
# `cb2026-syzygy` and only when the `syzygy` feature is on. A binary built with it is
# GPL-3.0-or-later as a whole (`crates/syzygy/LICENSE-GPL-3.0`); without it, cb2026 is
# `MIT OR Apache-2.0` throughout.
[[licenses.exceptions]]
crate = "shakmaty"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "shakmaty-syzygy"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, without a version; that's fine for
# crates that are never published.
allow-wildcard-paths = true

[sources]
# Only crates.io, and the Chess Node Protocol's own repository (cjus/chessgui#98).
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/cjus/chess-node-protocol"]
