[package]
name = "cb2026-trainer"
description = "cb2026's NNUE trainer: learns a network's weights from self-play records, with every gradient written by hand."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cb2026-chess.workspace = true
cb2026-nnue.workspace = true
# The GPU backend (`--features gpu`): wgpu runs on Metal on the Mac, Vulkan or DirectX 12
# elsewhere; pollster waits for its asynchronous calls; bytemuck views numbers as bytes.
bytemuck = { version = "1.25.2", optional = true }
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.1", optional = true }

[features]
# The GPU backend. Off by default, so `cargo test --workspace` and CI never build wgpu;
# `scripts/check.sh` builds and tests it on the Mac.
gpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[[bin]]
name = "trainer"
path = "src/main.rs"

[lints]
workspace = true
