[package]
name = "cb2026"
description = "cb2026: a UCI/XBoard chess engine with an interactive shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cb2026"
path = "src/main.rs"

[dependencies]
cb2026-engine.workspace = true
cb2026-protocol.workspace = true
cb2026-shell.workspace = true
cb2026-syzygy = { workspace = true, optional = true }

[features]
default = ["syzygy"]
# Syzygy endgame tablebases (the `SyzygyPath` option), through the cb2026-syzygy crate.
syzygy = ["dep:cb2026-syzygy"]

[lints]
workspace = true
