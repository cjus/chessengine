[package]
name = "cb2026"
description = "cb2026: a UCI/XBoard chess engine with an interactive shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cb2026"
path = "src/main.rs"

[dependencies]
cb2026-cnp.workspace = true
cb2026-engine.workspace = true
cb2026-net = { workspace = true, optional = true }
cb2026-protocol.workspace = true
cb2026-shell.workspace = true
cb2026-syzygy = { workspace = true, optional = true }
serde_json = { version = "1.0.154", optional = true }

[dev-dependencies]
cnp-conformance.workspace = true

[features]
default = ["syzygy"]
# Syzygy endgame tablebases (the `SyzygyPath` option), through the cb2026-syzygy crate. It links
# shakmaty-syzygy (GPL-3.0-or-later), so a binary built with it is GPL-3.0-or-later as a whole;
# `--no-default-features` builds a cb2026 that is `MIT OR Apache-2.0` throughout.
syzygy = ["dep:cb2026-syzygy"]
# `--serve`: the opt-in network listener (`cb2026-net`, docs/network-play.md). Off by default, so
# an ordinary build has no networking code at all; the release binaries decide separately.
net = ["dep:cb2026-net", "dep:serde_json"]

[lints]
workspace = true
